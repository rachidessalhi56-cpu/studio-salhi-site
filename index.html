<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- Thème clair/sombre : appliqué avant le rendu (pas de flash) -->
    <script>
      try {
        if ((localStorage.getItem('studio-salhi-theme') || 'dark') === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {
        document.documentElement.classList.add('dark')
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>استوديو الصالحي — مصوّر أعراس ومناسبات في المغرب | Studio Salhi</title>
    <meta
      name="description"
      content="استوديو الصالحي — مصوّر محترف في المغرب (العطاوية، قلعة السراغنة، مراكش). أعراس، خطوبة، سهرات خاصّة، مناسبات، فيديو ودرون. احجز موعدك أونلاين. | Studio Salhi — photographe professionnel au Maroc."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0a08'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='38' fill='%23c9a227' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Manrope:wght@400;500;600;700;800&family=Aref+Ruqaa:wght@400;500;600;700&family=Cairo:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applique la langue/dir sauvegardée AVANT le rendu React (évite tout flash)
      try {
        var l = localStorage.getItem('studio-salhi-lang') || 'ar'
        document.documentElement.lang = l
        document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
